apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaces
  namespace: spaces
  labels:
    app: spaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spaces
  template:
    metadata:
      labels:
        app: spaces
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: spaces
          image: ghcr.io/ndaden/spaces:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
