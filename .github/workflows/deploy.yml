name: Build and Deploy Spaces to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/spaces:latest
            ghcr.io/${{ env.REPO }}/spaces:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create Namespace and Apply Secrets
        run: |
          kubectl create namespace spaces --dry-run=client -o yaml | kubectl apply -f -

          # Secret pour télécharger l'image depuis GHCR (utilise GHCR_PULL_TOKEN ou GITHUB_TOKEN)
          PULL_TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"
          if [ -z "$PULL_TOKEN" ]; then
            PULL_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace spaces \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Deployment Image Version
        run: |
          sed -i "s|ghcr.io/ndaden/spaces:latest|ghcr.io/${{ env.REPO }}/spaces:${{ github.sha }}|g" k8s/02-deployment.yaml

      - name: Deploy resources to Kubernetes
        run: |
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/02-deployment.yaml
          kubectl apply -f k8s/03-service.yaml
          kubectl apply -f k8s/04-ingressroute.yaml

      - name: Force Deployment Rollout
        run: |
          kubectl rollout restart deployment spaces -n spaces
